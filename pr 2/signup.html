

<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
</head>

<body bgcolor="#EDE7F6">

<center>

    <br><br>

    <table border="1" cellpadding="20" bgcolor="#D1C4E9">
        <tr>
            <td align="center">

                <font color="#4A148C">
                    <h2>Create Account</h2>
                </font>

                <form action="login.html" method="post">

                    <label>Full Name</label><br>
                    <input type="text" name="fullname" placeholder="Enter your full name" required><br><br>

                    <label>Email</label><br>
                    <input type="email" name="email" placeholder="Enter your email" required><br><br>

                    <label>Phone Number</label><br>
                    <input type="tel" name="phone" placeholder="Enter your phone number" required><br><br>

                    <label>Username</label><br>
                    <input type="text" name="username" placeholder="Choose a username" required><br><br>

                    <label>Password</label><br>
                    <input type="password" name="password" placeholder="Create a password" required><br><br>

                    <label>Confirm Password</label><br>
                    <input type="password" name="confirmPassword" placeholder="Confirm your password" required><br><br>

                    <input type="submit" value="Sign Up">

                </form>

                <br>

                <p>
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>

            </td>
        </tr>
    </table>

</center>

</body>
</html>
