<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>StudentHub</h1>
        <p>College Events, Students, Notices and FAQs</p>
    </header>


    <!-- Navigation -->

    <nav>
        <button onclick="showSection('events')">Events</button>
        <button onclick="showSection('students')">Students</button>
        <button onclick="showSection('notices')">Notices</button>
        <button onclick="showSection('faqs')">FAQs</button>
    </nav>


    <!-- Controls -->

    <section class="controls">

        <input
            type="text"
            id="searchInput"
            placeholder="Search..."
        >

        <select id="filterSelect">
            <option value="all">All Categories</option>
        </select>

        <select id="sortSelect">

            <option value="default">
                Default Order
            </option>

            <option value="asc">
                A → Z
            </option>

            <option value="desc">
                Z → A
            </option>

        </select>

    </section>


    <!-- Loading -->

    <div id="loading">
        Loading data...
    </div>


    <!-- Error -->

    <div id="error"></div>


    <!-- Content -->

    <main id="content">

        <section id="eventsSection">

            <h2>College Events</h2>

            <div id="eventContainer"></div>

        </section>


        <section id="studentsSection">

            <h2>Student Profiles</h2>

            <div id="studentContainer"></div>

        </section>


        <section id="noticesSection">

            <h2>Notices</h2>

            <div id="noticeContainer"></div>

        </section>


        <section id="faqsSection">

            <h2>Frequently Asked Questions</h2>

            <div id="faqContainer"></div>

        </section>

    </main>


    <!-- Pagination -->

    <div class="pagination">

        <button id="prevBtn">
            Previous
        </button>

        <span id="pageInfo">
            Page 1
        </span>

        <button id="nextBtn">
            Next
        </button>

    </div>


    <script src="api.js"></script>
    <script src="app.js"></script>

</body>

</html>
